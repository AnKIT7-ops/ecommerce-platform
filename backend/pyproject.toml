[project]
name = "ecommerce-backend"
version = "1.0.0"
description = "FastAPI backend for the e-commerce platform"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "B008", # Depends()/Query() in defaults is the FastAPI idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    # Emitted by starlette/anyio internals, not by this project.
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore:.*httpx.*starlette.testclient.*:DeprecationWarning",
]
