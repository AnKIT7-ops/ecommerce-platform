<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ampere sells laptops, phones, gaming gear and workspace hardware, with honest specs and real stock counts."
    />
    <title>Ampere — components and gear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Resolve the theme before first paint. Doing this in React would leave a
      light flash on every load for dark-theme users, because the app only
      mounts after the stylesheet has already painted the body.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ampere.theme");
          document.documentElement.dataset.theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (error) {
          /* Storage blocked (private mode); fall back to the light theme. */
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
